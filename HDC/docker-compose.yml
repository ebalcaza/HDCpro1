services:
  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Se corrige para que la cadena de conexión use una variable de entorno limpia o se arme desde el .env sin quemar datos
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING:-Server=host.docker.internal\\SQLEXPRESS01;Database=HDC;Trusted_Connection=True;TrustServerCertificate=True;}
      Jwt__Clave: ${JWT_CLAVE}
      Jwt__Emisor: backend.API
      Jwt__Audiencia: frontend
      Jwt__ExpiraMinutos: ${JWT_EXPIRA_MINUTOS:-120}
      Admin__Email: ${ADMIN_EMAIL:-admin@hdc.com}
      Admin__Contrasena: ${ADMIN_CONTRASENA}
      Cors__Origenes__0: "http://localhost:${FRONTEND_PORT:-8080}"
      Cors__Origenes__1: "http://localhost:5173"
      Swagger__Habilitado: "true"
    ports:
      - "${API_PORT:-5000}:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped