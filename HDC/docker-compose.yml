name: hdc

services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "${DB_PORT:-14330}:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 20s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=${DB_NAME:-HuellaCarbono};User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__Clave: ${JWT_CLAVE}
      Jwt__Emisor: backend.API
      Jwt__Audiencia: frontend
      Jwt__ExpiraMinutos: ${JWT_EXPIRA_MINUTOS:-120}
      Admin__Email: ${ADMIN_EMAIL:-admin@hdc.com}
      Admin__Contrasena: ${ADMIN_CONTRASENA}
      Cors__Origenes__0: "http://localhost:${FRONTEND_PORT:-8080}"
      Cors__Origenes__1: "http://localhost:5173"
      Swagger__Habilitado: "true"
    ports:
      - "${API_PORT:-5000}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sqldata:
